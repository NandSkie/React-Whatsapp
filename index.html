<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Channel Reaction - Neobrutalism</title>
    <style>
        /* RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f0e8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* NEOBRUTALISM CONTAINER */
        .container {
            background: #ffffff;
            border: 4px solid #1a1a1a;
            border-radius: 0;
            padding: 40px;
            max-width: 650px;
            width: 100%;
            box-shadow: 12px 12px 0 #1a1a1a;
            position: relative;
            transition: all 0.1s ease;
        }

        .container:hover {
            box-shadow: 14px 14px 0 #1a1a1a;
            transform: translate(-2px, -2px);
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 4px solid #1a1a1a;
            padding-bottom: 20px;
        }

        .header-icon {
            font-size: 56px;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(4px 4px 0 #1a1a1a);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: -1px;
            text-transform: uppercase;
            background: #ffe082;
            display: inline-block;
            padding: 4px 16px;
            border: 3px solid #1a1a1a;
            transform: rotate(-1deg);
        }

        .header p {
            color: #333;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
            background: #e8e0d8;
            padding: 8px 16px;
            display: inline-block;
            border: 3px solid #1a1a1a;
        }

        /* FORM */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-weight: 800;
            font-size: 16px;
            color: #1a1a1a;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            background: #ffe082;
            padding: 4px 12px;
            border: 3px solid #1a1a1a;
            display: inline-block;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 4px solid #1a1a1a;
            border-radius: 0;
            font-size: 15px;
            font-weight: 500;
            background: #faf8f5;
            transition: all 0.1s ease;
            font-family: inherit;
            color: #1a1a1a;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            background: #ffffff;
            box-shadow: inset 4px 4px 0 #1a1a1a;
            transform: scale(0.99);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }

        .form-group .hint {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-top: 6px;
            padding: 4px 12px;
            background: #e8e0d8;
            border: 3px solid #1a1a1a;
            width: fit-content;
        }

        /* EMOJI GRID */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .emoji-btn {
            padding: 14px 8px;
            border: 4px solid #1a1a1a;
            border-radius: 0;
            background: #faf8f5;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
            font-weight: 700;
            position: relative;
            box-shadow: 4px 4px 0 #1a1a1a;
            line-height: 1;
        }

        .emoji-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #1a1a1a;
            background: #ffffff;
        }

        .emoji-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #1a1a1a;
        }

        .emoji-btn.active {
            background: #ffe082;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #1a1a1a;
            border-color: #1a1a1a;
        }

        .emoji-btn .emoji-label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            color: #1a1a1a;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        /* SUBMIT BUTTON */
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: #4fc3f7;
            border: 4px solid #1a1a1a;
            border-radius: 0;
            font-size: 20px;
            font-weight: 900;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 8px 8px 0 #1a1a1a;
            position: relative;
            font-family: inherit;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 #1a1a1a;
            background: #81d4fa;
        }

        .btn-primary:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0 #1a1a1a;
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: translate(0);
            box-shadow: 8px 8px 0 #1a1a1a;
        }

        .btn-primary .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 4px solid #1a1a1a;
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-primary.loading .spinner {
            display: block;
        }

        .btn-primary.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* RESULT */
        .result {
            margin-top: 28px;
            padding: 24px;
            border: 4px solid #1a1a1a;
            border-radius: 0;
            display: none;
            background: #faf8f5;
            box-shadow: 8px 8px 0 #1a1a1a;
        }

        .result.show {
            display: block;
            animation: neoSlide 0.3s ease;
        }

        @keyframes neoSlide {
            0% {
                opacity: 0;
                transform: translateX(-10px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .result.success {
            background: #c8e6c9;
            border-color: #1a1a1a;
        }

        .result.error {
            background: #ffcdd2;
            border-color: #1a1a1a;
        }

        .result .result-title {
            font-weight: 900;
            font-size: 20px;
            color: #1a1a1a;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            padding: 4px 12px;
            background: #ffffff;
            border: 3px solid #1a1a1a;
            display: inline-block;
        }

        .result .result-detail {
            color: #1a1a1a;
            font-size: 15px;
            font-weight: 600;
            line-height: 2;
            padding: 8px 0;
        }

        .result .result-detail .highlight {
            background: #ffe082;
            padding: 2px 10px;
            border: 3px solid #1a1a1a;
            font-weight: 900;
        }

        .result .result-json {
            background: #1a1a1a;
            color: #f5f0e8;
            padding: 16px;
            border: 4px solid #1a1a1a;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            overflow-x: auto;
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* LIMIT INFO */
        .limit-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #1a1a1a;
            border: 4px solid #1a1a1a;
            margin-top: 20px;
            display: none;
        }

        .limit-info.show {
            display: flex;
        }

        .limit-info .label {
            color: #f5f0e8;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .limit-info .value {
            font-weight: 900;
            color: #ffe082;
            font-size: 22px;
            background: #1a1a1a;
            padding: 2px 16px;
            border: 3px solid #ffe082;
        }

        /* QUICK EXAMPLES */
        .quick-examples {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 4px solid #1a1a1a;
        }

        .quick-examples p {
            font-weight: 800;
            font-size: 14px;
            color: #1a1a1a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .quick-example-btn {
            display: inline-block;
            padding: 8px 18px;
            margin: 4px;
            background: #e8e0d8;
            border: 4px solid #1a1a1a;
            border-radius: 0;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            box-shadow: 4px 4px 0 #1a1a1a;
        }

        .quick-example-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #1a1a1a;
            background: #ffe082;
        }

        .quick-example-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #1a1a1a;
        }

        /* STATUS BADGE */
        .status-badge {
            display: inline-block;
            padding: 4px 16px;
            border: 3px solid #1a1a1a;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            margin-top: 6px;
            background: #ffffff;
        }

        .status-badge.success {
            background: #c8e6c9;
        }

        .status-badge.error {
            background: #ffcdd2;
        }

        .status-badge.loading {
            background: #fff9c4;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                box-shadow: 8px 8px 0 #1a1a1a;
            }
            
            .container:hover {
                box-shadow: 10px 10px 0 #1a1a1a;
            }

            .emoji-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }

            .emoji-btn {
                font-size: 28px;
                padding: 12px 4px;
            }

            .header h1 {
                font-size: 20px;
                padding: 4px 12px;
            }

            .btn-primary {
                font-size: 16px;
                padding: 14px;
                box-shadow: 6px 6px 0 #1a1a1a;
            }

            .limit-info .value {
                font-size: 18px;
            }
        }

        @media (max-width: 400px) {
            .emoji-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .container {
                padding: 16px;
            }
        }

        /* SCROLLBAR STYLING */
        .result-json::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .result-json::-webkit-scrollbar-track {
            background: #333;
        }

        .result-json::-webkit-scrollbar-thumb {
            background: #ffe082;
            border: 2px solid #1a1a1a;
        }

        /* ADDITIONAL NEOBRUTALISM TOUCHES */
        .stripes {
            background: repeating-linear-gradient(
                45deg,
                #1a1a1a,
                #1a1a1a 4px,
                transparent 4px,
                transparent 8px
            );
            height: 8px;
            width: 100%;
            margin-bottom: 20px;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-weight: 700;
            font-size: 12px;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 3px solid #1a1a1a;
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Stripes -->
        <div class="stripes"></div>

        <!-- HEADER -->
        <div class="header">
            <span class="header-icon">📱</span>
            <h1>WhatsApp React</h1>
            <p>⚡ Neo Brutalism Edition</p>
        </div>

        <!-- FORM -->
        <form id="reactionForm">
            <!-- URL Input -->
            <div class="form-group">
                <label>🔗 Channel URL</label>
                <input 
                    type="url" 
                    id="channelUrl" 
                    placeholder="https://whatsapp.com/channel/..." 
                    value="https://whatsapp.com/channel/0029VayiXSpBKfi2d9flAT0N/828"
                    required
                >
                <span class="hint">⬇️ Paste URL channel disini</span>
            </div>

            <!-- Emoji Grid -->
            <div class="form-group">
                <label>😊 Pilih Emoji</label>
                <div class="emoji-grid" id="emojiGrid">
                    <button type="button" class="emoji-btn" data-emoji="👍">
                        👍
                        <span class="emoji-label">Thumbs</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="❤️">
                        ❤️
                        <span class="emoji-label">Love</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="🔥">
                        🔥
                        <span class="emoji-label">Fire</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="😂">
                        😂
                        <span class="emoji-label">Laugh</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="😍">
                        😍
                        <span class="emoji-label">Heart</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="😱">
                        😱
                        <span class="emoji-label">Shock</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="😹">
                        😹
                        <span class="emoji-label">Cry</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="🐱">
                        🐱
                        <span class="emoji-label">Cat</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="😵">
                        😵
                        <span class="emoji-label">Dizzy</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="🎉">
                        🎉
                        <span class="emoji-label">Party</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="💯">
                        💯
                        <span class="emoji-label">100</span>
                    </button>
                    <button type="button" class="emoji-btn" data-emoji="👏">
                        👏
                        <span class="emoji-label">Clap</span>
                    </button>
                </div>
                <span class="hint">👆 Klik emoji untuk memilih (bisa banyak)</span>
            </div>

            <!-- Manual Input -->
            <div class="form-group">
                <label>✏️ Atau Ketik Manual</label>
                <textarea 
                    id="emojiInput" 
                    placeholder="pisah pake koma, contoh: 👍,😵,😹,🐱"
                    rows="2"
                >👍,😵,😹,🐱</textarea>
                <span class="hint">📝 Pisahkan dengan koma atau spasi</span>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-primary" id="submitBtn">
                <span class="btn-text">🚀 Kirim Reaksi!</span>
                <div class="spinner"></div>
            </button>
        </form>

        <!-- Limit Info -->
        <div class="limit-info" id="limitInfo">
            <span class="label">📊 Sisa Limit</span>
            <span class="value" id="limitValue">-</span>
        </div>

        <!-- Result -->
        <div class="result" id="result">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-detail" id="resultDetail"></div>
            <div class="result-json" id="resultJson"></div>
        </div>

        <!-- Quick Examples -->
        <div class="quick-examples">
            <p>⚡ Quick Examples</p>
            <button type="button" class="quick-example-btn" data-url="https://whatsapp.com/channel/0029VayiXSpBKfi2d9flAT0N/828" data-emojis="👍,😵,😹,🐱">
                Example 1
            </button>
            <button type="button" class="quick-example-btn" data-url="https://whatsapp.com/channel/0029VayiXSpBKfi2d9flAT0N/828" data-emojis="❤️,🔥,😂">
                Example 2
            </button>
            <button type="button" class="quick-example-btn" data-url="https://whatsapp.com/channel/0029VayiXSpBKfi2d9flAT0N/828" data-emojis="🎉,💯,👏">
                Example 3
            </button>
            <button type="button" class="quick-example-btn" data-url="https://whatsapp.com/channel/0029VayiXSpBKfi2d9flAT0N/828" data-emojis="😱,😍,😹">
                Example 4
            </button>
        </div>

        <!-- Footer -->
        <div class="footer-text">
            ⚡ Made with 💪 &nbsp;•&nbsp; Neo Brutalism Style
        </div>
    </div>

    <script>
        // ===== STATE =====
        let selectedEmojis = [];
        let tokenData = null;

        // ===== DOM ELEMENTS =====
        const form = document.getElementById('reactionForm');
        const channelUrl = document.getElementById('channelUrl');
        const emojiInput = document.getElementById('emojiInput');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultDetail = document.getElementById('resultDetail');
        const resultJson = document.getElementById('resultJson');
        const limitInfo = document.getElementById('limitInfo');
        const limitValue = document.getElementById('limitValue');
        const emojiGrid = document.getElementById('emojiGrid');

        // ===== EMOJI SELECTION =====
        document.querySelectorAll('.emoji-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const emoji = this.dataset.emoji;
                const index = selectedEmojis.indexOf(emoji);
                
                if (index === -1) {
                    selectedEmojis.push(emoji);
                    this.classList.add('active');
                } else {
                    selectedEmojis.splice(index, 1);
                    this.classList.remove('active');
                }
                
                updateEmojiInput();
            });
        });

        function updateEmojiInput() {
            if (selectedEmojis.length > 0) {
                emojiInput.value = selectedEmojis.join(',');
            } else {
                emojiInput.value = '';
            }
        }

        // ===== SYNC INPUT WITH GRID =====
        emojiInput.addEventListener('input', function() {
            const emojis = parseEmojis(this.value);
            selectedEmojis = emojis;
            
            document.querySelectorAll('.emoji-btn').forEach(btn => {
                if (emojis.includes(btn.dataset.emoji)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        });

        // ===== PARSE EMOJIS =====
        function parseEmojis(input) {
            return input.split(/[,，\s]+/).filter(e => e.trim().length > 0);
        }

        // ===== QUICK EXAMPLES =====
        document.querySelectorAll('.quick-example-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                channelUrl.value = this.dataset.url;
                emojiInput.value = this.dataset.emojis;
                emojiInput.dispatchEvent(new Event('input'));
                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });

        // ===== API FUNCTIONS =====
        async function handshake() {
            const response = await fetch('https://satriareact.satriadeveloperz.workers.dev/api/handshake', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ server: 3 })
            });

            if (!response.ok) {
                throw new Error(`Handshake gagal: ${response.status}`);
            }

            return await response.json();
        }

        async function sendReaction(url, reactions, token, authToken = null, server = 3) {
            const payload = {
                url: url,
                reactions: reactions,
                token: token,
                authToken: authToken,
                server: server
            };

            const response = await fetch('https://satriareact.satriadeveloperz.workers.dev/api/react', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`API gagal: ${response.status}`);
            }

            return await response.json();
        }

        // ===== VALIDATE URL =====
        function isValidUrl(url) {
            try {
                const parsed = new URL(url);
                return parsed.hostname.includes('whatsapp.com') && 
                       parsed.pathname.includes('/channel/');
            } catch {
                return false;
            }
        }

        // ===== SHOW RESULT =====
        function showResult(success, title, detail, data = null) {
            resultDiv.className = 'result show';
            resultDiv.classList.add(success ? 'success' : 'error');
            resultTitle.textContent = title;
            resultDetail.innerHTML = detail;
            
            if (data) {
                resultJson.textContent = JSON.stringify(data, null, 2);
                resultJson.style.display = 'block';
            } else {
                resultJson.style.display = 'none';
            }

            // Scroll to result
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // ===== FORM SUBMIT =====
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const url = channelUrl.value.trim();
            const emojiInputValue = emojiInput.value.trim();
            
            // Validate
            if (!url) {
                showResult(false, '⚠️ Error!', 'Masukkan URL channel dulu bang!');
                return;
            }

            if (!isValidUrl(url)) {
                showResult(false, '⚠️ Error!', 'URL tidak valid! Pastikan itu URL channel WhatsApp ya!');
                return;
            }

            if (!emojiInputValue) {
                showResult(false, '⚠️ Error!', 'Pilih atau ketik emoji dulu!');
                return;
            }

            const emojis = parseEmojis(emojiInputValue);
            if (emojis.length === 0) {
                showResult(false, '⚠️ Error!', 'Emoji nya mana nih?');
                return;
            }

            // Loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            resultDiv.className = 'result';
            limitInfo.classList.remove('show');

            try {
                // Step 1: Handshake
                showResult(true, '🔄 Connecting...', 'Lagihandshake sama server...');
                
                const handshakeData = await handshake();
                tokenData = handshakeData;
                
                // Show limit
                if (handshakeData.freeLimit !== undefined) {
                    limitInfo.classList.add('show');
                    limitValue.textContent = handshakeData.freeLimit;
                }

                // Step 2: Send reaction
                showResult(true, '📤 Mengirim...', 
                    `Ngirim ${emojis.length} reaksi ke channel...`
                );

                const result = await sendReaction(
                    url,
                    emojis,
                    handshakeData.token,
                    handshakeData.authToken,
                    handshakeData.server
                );

                // Show result
                if (result.success) {
                    let detail = `
                        <div>✅ <span class="highlight">BERHASIL!</span></div>
                        <div>📝 ${result.message}</div>
                        <div>📊 Jumlah reaksi: <span class="highlight">${result.count || emojis.length}</span></div>
                    `;

                    if (result.data) {
                        if (result.data.newLimit !== undefined) {
                            detail += `<div>📊 Sisa limit: <span class="highlight">${result.data.newLimit}</span></div>`;
                            limitValue.textContent = result.data.newLimit;
                        }
                        if (result.data.data?.response_time) {
                            detail += `<div>⏱️ Response: <span class="highlight">${result.data.data.response_time}</span></div>`;
                        }
                        if (result.data.data?.author) {
                            detail += `<div>👤 Author: <span class="highlight">${result.data.data.author}</span></div>`;
                        }
                        if (result.data.data?.limit_remaining !== undefined) {
                            detail += `<div>📊 Limit tersisa: <span class="highlight">${result.data.data.limit_remaining}</span></div>`;
                        }
                    }

                    showResult(true, '✅ Sukses!', detail, result);
                } else {
                    showResult(false, '❌ Gagal', result.message || 'Ada yang error nih!', result);
                }

            } catch (error) {
                showResult(false, '❌ Error!', error.message || 'Server error nih! Coba lagi nanti');
                console.error('Error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        });

        // ===== INIT =====
        // Load default emojis
        setTimeout(() => {
            const defaultEmojis = ['👍', '😵', '😹', '🐱'];
            defaultEmojis.forEach(emoji => {
                const btn = document.querySelector(`.emoji-btn[data-emoji="${emoji}"]`);
                if (btn) {
                    btn.classList.add('active');
                    selectedEmojis.push(emoji);
                }
            });
            updateEmojiInput();
        }, 100);

        console.log('📱 WhatsApp Channel Reaction - Neo Brutalism Edition');
        console.log('🔗 Default URL:', channelUrl.value);
        console.log('😊 Default emojis:', selectedEmojis);
    </script>
</body>
</html>
